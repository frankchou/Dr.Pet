<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand',sans-serif;background:#F4F7FB;color:#111;padding:28px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{font-family:inherit;font-weight:700;cursor:pointer;border:none}
  .cta{background:#111;color:#fff;border-radius:16px;padding:14px 22px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.1)}
  .soft{background:#FEF1E2;color:#D98A53;border-radius:9999px;padding:13px 22px;font-size:14px}
  .ghost{background:#F1F5F9;color:#475569;border-radius:9999px;padding:10px 18px;font-size:13px}
  .google{background:#fff;border:2px solid #F1F5F9;color:#334155;border-radius:16px;padding:14px 22px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .fab{width:56px;height:56px;border-radius:9999px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
</style></head><body>
  <div class="row">
    <button class="cta">儲存檔案</button>
    <button class="soft">＋ 加入試用清單</button>
    <button class="ghost">取消</button>
  </div>
  <div class="row">
    <button class="google"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>使用 Google 繼續</button>
    <div class="fab"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
  </div>
</body></html>
