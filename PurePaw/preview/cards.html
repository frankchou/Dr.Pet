<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:28px}
  .card{background:#fff;border:2px solid rgba(15,23,42,.05);border-radius:28px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;align-items:center;gap:16px;max-width:340px}
  .chip{width:56px;height:56px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(15,23,42,.05);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  h3{margin:0 0 8px;font-size:18px;font-weight:700;color:#1E293B}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#F8FAFC;border:1px solid #E2E8F0;color:#475569;font-weight:700;font-size:11px;padding:4px 10px;border-radius:9999px}
</style></head><body>
  <div class="card">
    <div class="chip" style="background:#FEF1E2">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10c.7-.7 1.4-1 2-1a3 3 0 010 6c-.6 0-1.3-.3-2-1v0c-.7.7-1.4 1-2 1a3 3 0 010-6c.6 0 1.3.3 2 1z"/><path d="M7 10c-.7-.7-1.4-1-2-1a3 3 0 000 6c.6 0 1.3-.3 2-1v0c.7.7 1.4 1 2 1a3 3 0 000-6c-.6 0-1.3.3-2 1z"/><path d="M7 12h10"/></svg>
    </div>
    <div>
      <h3>飲食需知</h3>
      <div class="tags"><span class="tag">雞肉</span><span class="tag">鴨肉</span><span class="tag" style="background:#D98A53;color:#fff;border:none">蜂膠</span></div>
    </div>
  </div>
</body></html>
