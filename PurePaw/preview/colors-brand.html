<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:24px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:150px;border-radius:18px;overflow:hidden;border:2px solid rgba(15,23,42,.05);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .chip{height:74px}
  .meta{padding:8px 12px}
  .name{font-weight:700;font-size:13px}
  .hex{font-weight:500;font-size:11px;color:#64748B;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFE8D6"></div><div class="meta"><div class="name">Apricot 杏</div><div class="hex">#FFE8D6</div></div></div>
  <div class="sw"><div class="chip" style="background:#FEF1E2"></div><div class="meta"><div class="name">Apricot soft</div><div class="hex">#FEF1E2</div></div></div>
  <div class="sw"><div class="chip" style="background:#D98A53"></div><div class="meta"><div class="name">Accent 焦糖</div><div class="hex">#D98A53</div></div></div>
  <div class="sw"><div class="chip" style="background:#111111"></div><div class="meta"><div class="name">Ink 黑</div><div class="hex">#111111</div></div></div>
</div>
</body></html>
