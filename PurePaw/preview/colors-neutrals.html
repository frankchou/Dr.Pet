<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:24px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:120px;border-radius:16px;overflow:hidden;border:2px solid rgba(15,23,42,.05);background:#fff}
  .chip{height:60px}
  .meta{padding:7px 10px}
  .name{font-weight:700;font-size:12px}
  .hex{font-weight:500;font-size:10px;color:#64748B;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F4F7FB"></div><div class="meta"><div class="name">Canvas</div><div class="hex">#F4F7FB</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#F1F5F9"></div><div class="meta"><div class="name">slate-100</div><div class="hex">#F1F5F9</div></div></div>
  <div class="sw"><div class="chip" style="background:#E2E8F0"></div><div class="meta"><div class="name">slate-200</div><div class="hex">#E2E8F0</div></div></div>
  <div class="sw"><div class="chip" style="background:#94A3B8"></div><div class="meta"><div class="name">slate-400</div><div class="hex">#94A3B8</div></div></div>
  <div class="sw"><div class="chip" style="background:#64748B"></div><div class="meta"><div class="name">slate-500</div><div class="hex">#64748B</div></div></div>
</div>
</body></html>
