<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:24px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:122px;border-radius:16px;overflow:hidden;border:2px solid rgba(15,23,42,.05);background:#fff}
  .chip{height:56px}
  .meta{padding:7px 10px}
  .name{font-weight:700;font-size:12px}
  .hex{font-weight:500;font-size:10px;color:#64748B;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#2D6A4F"></div><div class="meta"><div class="name">Green 健康</div><div class="hex">#2D6A4F</div></div></div>
  <div class="sw"><div class="chip" style="background:#E2F3E4"></div><div class="meta"><div class="name">Green soft</div><div class="hex">#E2F3E4</div></div></div>
  <div class="sw"><div class="chip" style="background:#FCA5A5"></div><div class="meta"><div class="name">Pink 腮紅</div><div class="hex">#FCA5A5</div></div></div>
  <div class="sw"><div class="chip" style="background:#F391B3"></div><div class="meta"><div class="name">Pink 美容</div><div class="hex">#F391B3</div></div></div>
  <div class="sw"><div class="chip" style="background:#FDE047"></div><div class="meta"><div class="name">Yellow 星</div><div class="hex">#FDE047</div></div></div>
  <div class="sw"><div class="chip" style="background:#7C9CE3"></div><div class="meta"><div class="name">Blue 日程</div><div class="hex">#7C9CE3</div></div></div>
  <div class="sw"><div class="chip" style="background:#DC2626"></div><div class="meta"><div class="name">Danger</div><div class="hex">#DC2626</div></div></div>
  <div class="sw"><div class="chip" style="background:#FEF2F2"></div><div class="meta"><div class="name">Danger soft</div><div class="hex">#FEF2F2</div></div></div>
</div>
</body></html>
