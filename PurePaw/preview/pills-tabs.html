<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:28px;display:flex;flex-direction:column;gap:18px}
  .seg{display:flex;background:#F1F5F9;padding:6px;border-radius:9999px;width:300px}
  .seg button{flex:1;border:none;font-family:inherit;font-weight:700;font-size:13px;padding:8px;border-radius:9999px;cursor:pointer;background:transparent;color:#64748B}
  .seg button.on{background:#111;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .seg.white button.on{background:#fff;color:#111}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-weight:700;font-size:12px;padding:6px 16px;border-radius:9999px}
  .pill.on{background:#111;color:#fff}.pill.off{background:#F1F5F9;color:#475569}
  .tag{background:#F8FAFC;border:1px solid #E2E8F0;color:#475569;font-weight:700;font-size:11px;padding:4px 10px;border-radius:9999px}
  .tag.acc{background:#D98A53;color:#fff;border:none}
</style></head><body>
  <div class="seg"><button class="on">月曆頁面</button><button>週曆頁面</button></div>
  <div class="seg white"><button class="on">早餐</button><button>中餐</button><button>晚餐</button></div>
  <div class="pills">
    <span class="pill on">全部商品</span><span class="pill off">飼料</span><span class="pill off">保健品</span>
  </div>
  <div class="pills">
    <span class="tag">雞肉</span><span class="tag">鴨肉</span><span class="tag acc">✦ 蜂膠</span><span class="tag">腎臟病</span><span class="tag">無穀</span>
  </div>
</body></html>
