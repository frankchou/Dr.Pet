<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand',sans-serif;background:#F4F7FB;color:#111;padding:28px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .item{text-align:center}
  .box{width:90px;height:64px;background:#fff;border:2px solid rgba(15,23,42,.05);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .lbl{font-size:11px;font-weight:700;color:#64748B;margin-top:8px;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:9999px;width:64px"></div><div class="lbl">pill</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="lbl">16 · 2xl</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="lbl">20 · icon</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="lbl">24 · 3xl</div></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><div class="lbl">28 · card</div></div>
  <div class="item"><div class="box" style="border-radius:32px"></div><div class="lbl">32 · hero</div></div>
  <div class="item"><div class="box" style="border-radius:40px"></div><div class="lbl">40 · panel</div></div>
</div>
</body></html>
