<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Quicksand','Noto Sans TC',sans-serif;background:#F4F7FB;color:#111;padding:28px;display:flex;gap:40px;align-items:center;flex-wrap:wrap}
  .grp{display:flex;flex-direction:column;gap:14px}
  .lbl{font-size:11px;font-weight:700;color:#94A3B8;font-family:ui-monospace,monospace}
  .sw{width:48px;height:28px;border-radius:9999px;position:relative}
  .sw.on{background:#111}.sw.off{background:#E2E8F0}
  .knob{position:absolute;top:4px;width:20px;height:20px;border-radius:9999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .knob.r{right:4px}.knob.l{left:4px}
  .ck{width:20px;height:20px;border-radius:9999px;display:flex;align-items:center;justify-content:center;border:2px solid}
  .ck.on{background:#111;border-color:#111;color:#fff}.ck.off{border-color:#CBD5E1;background:#fff}
  .ic{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#334155}
</style></head><body>
  <div class="grp">
    <div class="lbl">switch</div>
    <div class="sw on"><div class="knob r"></div></div>
    <div class="sw off"><div class="knob l"></div></div>
  </div>
  <div class="grp">
    <div class="lbl">radio / check</div>
    <div class="ic"><div class="ck on"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>洗澡</div>
    <div class="ic"><div class="ck off"></div>剪甲</div>
  </div>
</body></html>
